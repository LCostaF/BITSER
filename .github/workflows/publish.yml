name: Build wheels and publish to PyPI

on:
  push:
    tags:
      - "v*"   # triggers on version tags like v0.3.4

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_ARCHS_MACOS: auto
          CIBW_BUILD: cp313-*
          CIBW_TEST_REQUIRES: pytest cython numpy bio rich typer scikit-learn xgboost joblib matplotlib seaborn pandas scipy
          CIBW_TEST_COMMAND: "pytest {project}/tests -x -q"
          CIBW_BEFORE_TEST_LINUX: "mv {project}/bitser {project}/bitser_source"
          CIBW_AFTER_TEST_LINUX: "mv {project}/bitser_source {project}/bitser"
          CIBW_BEFORE_TEST_MACOS: "mv {project}/bitser {project}/bitser_source"
          CIBW_AFTER_TEST_MACOS: "mv {project}/bitser_source {project}/bitser"
          CIBW_BEFORE_TEST_WINDOWS: "ren {project}\\bitser bitser_source"
          CIBW_AFTER_TEST_WINDOWS: "ren {project}\\bitser_source bitser"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Build sdist
        run: poetry build --format sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
