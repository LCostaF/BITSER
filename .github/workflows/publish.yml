name: Build wheels and publish to PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  build_wheels_linux:
    name: Build wheels on ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: cp313-*
          CIBW_TEST_REQUIRES: pytest cython numpy bio rich typer scikit-learn xgboost joblib matplotlib seaborn pandas scipy
          CIBW_TEST_COMMAND: "pytest {project}/tests -x -q"
          CIBW_BEFORE_TEST_LINUX: >
            (yum install -y openblas-devel || apt-get install -y libopenblas-dev) &&
            pip install --only-binary=scipy scipy &&
            mv {project}/bitser {project}/bitser_source
          CIBW_AFTER_TEST_LINUX: "mv {project}/bitser_source {project}/bitser"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: ./wheelhouse/*.whl

  build_wheels_windows:
    name: Build wheels on windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: cp313-*
          CIBW_TEST_REQUIRES: pytest cython numpy bio rich typer scikit-learn xgboost joblib matplotlib seaborn pandas scipy
          CIBW_TEST_COMMAND: "pytest {project}/tests -x -q"
          CIBW_BEFORE_TEST_WINDOWS: >
            pip install --only-binary=scipy scipy &&
            move {project}\bitser {project}\bitser_source
          CIBW_AFTER_TEST_WINDOWS: "move {project}\bitser_source {project}\bitser"

      - name: Upload wheels as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pip install poetry

      - name: Build sdist
        run: poetry build --format sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build_wheels_linux, build_wheels_windows, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
